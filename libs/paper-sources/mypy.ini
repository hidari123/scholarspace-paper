# mypy - type checking config (base)
#
# IMPORTANT: This file MUST stay ASCII-only.
#
# Reason: mypy reads .ini files with the system locale codec (GBK on
# Chinese Windows). Non-ASCII characters in comments cause
# "UnicodeDecodeError: 'gbk' codec can't decode byte ...".
#
# Use English comments here. Chinese docs live in docs/05-code-guidelines.md.
#
# IMPORTANT: mypy has NO config-inheritance mechanism.
#   - `[tool.mypy] extends` in pyproject.toml -> "Unrecognized option"
#   - `[mypy] include` in mypy.ini            -> "Unrecognized option"
# The only way to share config is to COPY the base into each project.
# `cli new` does that; `cli sync` refreshes it.
#
# PER-MODULE SECTIONS:
#   The sections below use the wildcard `*-name` form that mypy supports
#   for ANY package. Do NOT use a literal package name here, because the
#   package name differs per project.
#
# Usage: copy this file to <pkg>/mypy.ini, then append project overrides.

[mypy]
python_version = 3.13
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
pretty = True
namespace_packages = True
explicit_package_bases = True
# NOTE: the pydantic.mypy plugin is NOT enabled here on purpose.
#
# Reason: pure-domain packages (e.g. scholarspace-identity-core) have zero
# runtime dependencies and therefore no pydantic installed. Enabling the
# plugin globally would break them with
# "Cannot find implementation or library stub for module named pydantic".
#
# Packages that DO use pydantic should add it to their own mypy.ini:
#   plugins = pydantic.mypy
#
# src/ layout: without this, mypy sees the same file under two module names
mypy_path = src
exclude = (?x)(^.*/migrations/.*,|^.*/alembic/.*,|^.*/build/.*,|^.*/dist/.*)

# ============================================================================
# Relaxed per-module rules
# ============================================================================
# NOTE: per-module sections may only contain per-module flags.
#       `exclude` and `plugins` are NOT allowed here.

# Domain layer: dataclasses / value objects occasionally need Any
[mypy-*.domain.*]
disallow_any_explicit = False
disallow_untyped_defs = True

# Tests: untyped fixtures and decorators are fine
[mypy-*.tests.*]
disallow_untyped_defs = False
disallow_untyped_decorators = False
disallow_incomplete_defs = False
warn_unused_ignores = False

# Alembic migrations
[mypy-*.alembic.*]
disallow_untyped_defs = False

# Third-party packages without type stubs
[mypy-yarllib.*]
ignore_missing_imports = True

[mypy-magic.*]
ignore_missing_imports = True
